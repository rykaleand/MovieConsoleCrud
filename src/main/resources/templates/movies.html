<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Movies</title>
</head>
<body>
<h1>Список фильмов</h1>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Год</th>
        <th>Длительность</th>
    </tr>
    <tr th:each="movie : ${movies}">
        <td th:text="${movie.id}"></td>
        <td th:text="${movie.title}"></td>
        <td th:text="${movie.releaseYear}"></td>
        <td th:text="${movie.duration}"></td>
    </tr>
</table>
</body>
</html>
